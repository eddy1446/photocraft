name: Build PhotoCraft Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build web app and package APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out PhotoCraft
        uses: actions/checkout@v4

      - name: Check out Craft Fonts
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          path: craft-fonts

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        run: cargo install --locked trunk

      - name: Place Craft Fonts beside the repository
        run: mv "$GITHUB_WORKSPACE/craft-fonts" "$GITHUB_WORKSPACE/../craft-fonts"

      - name: Build PhotoCraft WebAssembly app
        working-directory: apps/photocraft-web
        run: trunk build --release --dist "$GITHUB_WORKSPACE/dist"

      - name: Set up Node.js 22 for Capacitor
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package web build as Android APK
        uses: darkshredder/web-to-app-action@main
        with:
          build-folder-path: dist
          app-name: PhotoCraft
          output-folder-path: my-apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: photocraft-android-apk
          path: my-apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
