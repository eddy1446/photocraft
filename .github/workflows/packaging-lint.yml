name: Build Web App and Android APK
on: [push, workflow_dispatch]

jobs:
  build-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PhotoCraft
        uses: actions/checkout@v4

      - name: Checkout Craft Fonts
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          path: craft-fonts

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        run: cargo install --locked trunk

      - name: Move Fonts to Relative Path
        run: mv craft-fonts ../craft-fonts

      - name: Build Web App (Wasm)
        run: trunk build --release

      # Fixed APK Compiler Action
      - name: Convert Web Build to Android APK
        uses: darkshredder/web-to-app-action@main
        with:
          build-folder-path: "dist"    # Points to your compiled Rust files
          app-name: "PhotoCraft"       # Your installed app display name
          output-folder-path: "my-apk" # Temporary folder for output structures

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: photocraft-android-apk
          path: my-apk/
